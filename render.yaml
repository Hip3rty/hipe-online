# Blueprint do Render (https://render.com/docs/blueprint-spec)
# Banco grátis do próprio Render, ligado automaticamente ao servidor: nenhuma senha para copiar.
# ATENÇÃO: o Postgres grátis do Render expira 30 dias após a criação (dá para fazer upgrade antes).
# Para um banco permanente (Supabase), troque DATABASE_URL por um valor fixo e adicione DB_PASSWORD
# (veja docs/DEPLOY.md).
databases:
  - name: hipe-db
    plan: free
    region: oregon
    databaseName: hipe
    user: hipe

services:
  - type: web
    name: hipe-online
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hipe-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false" # conexão interna da rede do Render
      - key: SAVE_INTERVAL_MS
        value: "60000"
      - key: MAX_PLAYERS
        value: "150"
      - key: LOG_LEVEL
        value: info
