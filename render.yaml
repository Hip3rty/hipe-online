# Blueprint do Render (https://render.com/docs/blueprint-spec)
# O endereço do banco (sem senha) já vem preenchido. No painel só é preciso colar a senha em DB_PASSWORD.
services:
  - type: web
    name: hipe-online
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Supabase, projeto hipe-online (Session pooler, São Paulo). Não contém senha.
      - key: DATABASE_URL
        value: postgresql://postgres.jyxfstsxzgxyrxlsgpqq@aws-0-sa-east-1.pooler.supabase.com:5432/postgres
      - key: DB_PASSWORD
        sync: false # cole aqui a senha do banco (Supabase › Database Settings › Reset password)
      - key: DATABASE_SSL
        value: "true"
      - key: SAVE_INTERVAL_MS
        value: "60000"
      - key: MAX_PLAYERS
        value: "150"
      - key: LOG_LEVEL
        value: info
